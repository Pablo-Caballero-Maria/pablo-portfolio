# Checks every push and pull request: types, lint, formatting, unit and component tests with coverage,
# the production build and the end-to-end tests against it. Vercel deploys separately (see README).
name: CI

on:
  push:
    branches-ignore: [badges]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Types, lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: TypeScript (with Next's route types)
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  tests:
    name: Unit and component tests, with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest with coverage (lib, content and components)
        run: npm run test:coverage
      - name: Coverage summary
        id: coverage
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (n, m) => `| ${n} | ${m.pct} % | ${m.covered} / ${m.total} |`;
            console.log(["### Coverage", "", "| Metric | % | Covered |", "| --- | ---: | ---: |",
              row("Statements", t.statements), row("Branches", t.branches), row("Functions", t.functions), row("Lines", t.lines)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
          echo "percent=$(node -p 'Math.round(require("./coverage/coverage-summary.json").total.statements.pct)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Production build (every page prerendered)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright (home page, theme, globe and every project page)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  badge:
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, tests, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish coverage.json on the badges branch
        env:
          PERCENT: ${{ needs.tests.outputs.coverage }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          color=$(awk -v p="$PERCENT" 'BEGIN { print (p >= 90) ? "brightgreen" : (p >= 75) ? "green" : (p >= 60) ? "yellowgreen" : "orange" }')
          mkdir badges && cd badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PERCENT" "$color" > coverage.json
          # The branch only holds the badge: Vercel must not deploy it.
          printf '{"git":{"deploymentEnabled":false}}\n' > vercel.json
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Coverage: ${PERCENT} %"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
